services:
  mysql:
    image: mysql:8.4
    container_name: zero-link-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: zero_link
      MYSQL_USER: zerolink
      MYSQL_PASSWORD: zerolink
      MYSQL_ROOT_PASSWORD: zerolink_root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - zero-link-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uzerolink -pzerolink --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: zero-link-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - zero-link-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zero-link-mysql-data:
  zero-link-redis-data:
