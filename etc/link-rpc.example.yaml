Name: link-rpc
ListenOn: 127.0.0.1:9090

Dependencies:
  MySQL:
    Endpoint: 127.0.0.1:3306
    Database: zero_link
    User: zerolink
    DataSource: zerolink:zerolink@tcp(127.0.0.1:3306)/zero_link?charset=utf8mb4&parseTime=true&loc=Local
  Redis:
    Endpoint: 127.0.0.1:6379

CacheRedis:
  - Host: 127.0.0.1:6379
    Type: node

Analytics:
  IPSalt: replace-with-production-ip-salt

# Telemetry:
#   Name: link-rpc
#   Endpoint: http://localhost:4317
#   Sampler: 0.0   # set to 1.0 when Jaeger is running locally
#   Batcher: otlpgrpc

Prometheus:
  Host: 127.0.0.1
  Port: 9101
  Path: /metrics

Middlewares:
  Trace: false
  Prometheus: true
  Metrics: false

Retention:
  VisitEventRetentionDays: 90
  ShortLinkRetentionDays: 365
  DailyStatRetentionDays: 730
  CleanupBatchSize: 1000

Cuckoo:
  Capacity: 1000000
