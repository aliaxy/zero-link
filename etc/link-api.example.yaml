Name: link-api
Host: 127.0.0.1
Port: 8080

Auth:
  Secret: replace-with-local-management-jwt-secret
  TokenTTLSeconds: 86400

Cors:
  AllowOrigins:
    - "http://localhost:5173"

MaxConns: 1000
MaxBytes: 1048576

Redis:
  Host: 127.0.0.1:6379

RateLimit:
  RedirectPerIPPerSecond: 20
  LoginPerIPPerMinute: 10
  TrustedProxies: []  # IP addresses of trusted reverse proxies (e.g. ["127.0.0.1"])

LinkRPC:
  Target: 127.0.0.1:9090

# Telemetry:
#   Name: link-api
#   Endpoint: http://localhost:4317
#   Sampler: 0.0   # set to 1.0 when Jaeger is running locally
#   Batcher: otlpgrpc

Prometheus:
  Host: 127.0.0.1
  Port: 9100
  Path: /metrics
